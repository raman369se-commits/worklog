<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
<title>WORKLOG v0.15 — Work Time Tracking</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Golos+Text:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root{
    --paper:#ffffff;
    --paper-raised:#ffffff;
    --ink:#171717;
    --ink-soft:#726C5C;
    --line:#e5e5e5;
    --accent-hourly:#171717;
    --accent-hourly-soft:#DCE6EA;
    --accent-fixed:#171717;
    --accent-fixed-soft:#EFE0C8;
    --danger:#9B3A3A;
    --radius:4px;
  }
  *,*::before,*::after{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{
    background:var(--paper);
    color:var(--ink);
    font-family:'Golos Text',-apple-system,'Segoe UI',Roboto,sans-serif;
    -webkit-font-smoothing:antialiased;
    min-height:100vh;
  }
  h1,h2,h3,p{margin:0;}
  button{font-family:inherit;}
  #app{max-width:480px;margin:0 auto;min-height:100vh;background:var(--paper);padding-bottom:40px;position:relative;}

  .topbar{
    position:sticky;top:0;z-index:5;
    display:flex;align-items:center;justify-content:space-between;
    padding:14px 16px;background:var(--paper);border-bottom:1px solid var(--line);
  }
  .topbar-title{font-weight:600;font-size:17px;letter-spacing:.2px;}
  .back-btn{background:none;border:none;color:var(--ink);font-size:15px;padding:8px 4px;cursor:pointer;min-width:56px;text-align:left;}

  .home-header{padding:20px 16px 8px;}
  .home-title{font-size:26px;font-weight:700;letter-spacing:.1px;}
  .home-subtitle{color:var(--ink-soft);font-size:13.5px;margin-top:4px;line-height:1.4;}

  .storage-notice{margin:12px 16px 4px;padding:12px 14px;background:var(--accent-fixed-soft);border:1px solid var(--accent-fixed);border-radius:var(--radius);font-size:12.5px;color:var(--ink);line-height:1.5;}
  .storage-actions{display:flex;gap:8px;margin-top:8px;}
  .notice-btn{flex:1;text-align:center;background:var(--paper-raised);border:1px solid var(--accent-fixed);color:var(--accent-fixed);padding:8px 4px;border-radius:var(--radius);font-size:12.5px;font-weight:600;cursor:pointer;}
  .import-error{color:var(--danger);font-size:12px;margin-top:6px;}

  .summary-panel{margin:14px 16px 4px;background:var(--paper-raised);border:1px solid var(--line);border-radius:var(--radius);padding:12px 14px;}
  .summary-header{display:flex;align-items:center;justify-content:space-between;}
  .summary-nav{background:none;border:none;color:var(--ink-soft);font-size:18px;padding:2px 10px;cursor:pointer;}
  .summary-month-label{font-size:13.5px;font-weight:600;color:var(--ink);}
  .summary-body{display:flex;flex-direction:column;gap:4px;margin-top:8px;}
  .summary-stat{display:flex;justify-content:space-between;align-items:baseline;font-size:13px;color:var(--ink-soft);font-family:'IBM Plex Mono',monospace;}
  .summary-stat b{color:var(--ink);font-weight:600;}
  .summary-stat-advance{padding-top:5px;margin-top:3px;border-top:1px solid var(--line);}
  .summary-stat-advance span,.summary-stat-advance b{font-weight:600;}

  .status-tabs{display:flex;gap:6px;padding:12px 16px 4px;}
  .tab-btn{flex:1;padding:8px 4px;border:1px solid var(--line);background:var(--paper-raised);border-radius:var(--radius);font-size:12.5px;color:var(--ink-soft);cursor:pointer;}
  .tab-btn.active{background:var(--ink);color:var(--paper-raised);border-color:var(--ink);}

  .add-job-btn{
    display:block;width:calc(100% - 32px);margin:14px 16px 8px;
    background:var(--ink);color:var(--paper-raised);border:none;
    padding:13px;border-radius:var(--radius);font-size:15px;font-weight:600;cursor:pointer;
  }
  .add-job-btn:active{opacity:.85;}

  .empty-state{padding:60px 24px;text-align:center;color:var(--ink-soft);font-size:14.5px;line-height:1.6;}

  .job-list{padding:8px 16px 16px;display:flex;flex-direction:column;gap:10px;}
  .job-card{
    background:var(--paper-raised);border:1px solid var(--line);border-left:4px solid var(--accent-hourly);
    border-radius:var(--radius);padding:13px 14px;cursor:pointer;
  }
  .job-card.fixed{border-left-color:var(--accent-fixed);}
  .job-card.done{opacity:.65;}
  .job-card:active{background:#F1EEE3;}
  .job-card-top{display:flex;align-items:flex-start;justify-content:space-between;gap:8px;}
  .job-location{font-weight:600;font-size:15.5px;line-height:1.3;}
  .job-badges{display:flex;flex-direction:column;gap:4px;align-items:flex-end;}
  .job-badge{font-size:11px;padding:3px 8px;border-radius:20px;white-space:nowrap;border:1px solid;font-weight:500;}
  .badge-hourly{background:var(--accent-hourly-soft);color:var(--accent-hourly);border-color:var(--accent-hourly-soft);}
  .badge-fixed{background:var(--accent-fixed-soft);color:var(--accent-fixed);border-color:var(--accent-fixed-soft);}
  .badge-done{background:#DEDCD2;color:var(--ink-soft);border-color:#DEDCD2;}
  .job-customer{color:var(--ink-soft);font-size:13px;margin-top:5px;}
  .job-divider{height:1px;background:var(--line);margin:10px 0;}
  .job-stats{display:flex;align-items:baseline;justify-content:space-between;font-family:'IBM Plex Mono',monospace;font-size:13px;color:var(--ink-soft);}
  .job-pay{color:var(--ink);font-weight:600;font-size:14px;}

  .form-body{padding:16px;display:flex;flex-direction:column;gap:16px;}
  .field{display:flex;flex-direction:column;gap:5px;}
  .field-label{font-size:12.5px;color:var(--ink-soft);}
  .field input,.field select{
    font-size:16px;padding:10px 11px;border:1px solid var(--line);border-radius:var(--radius);
    background:var(--paper-raised);color:var(--ink);font-family:inherit;width:100%;
  }
  .field input:focus,.field select:focus,input:focus-visible,button:focus-visible{
    outline:2px solid var(--accent-hourly);outline-offset:1px;
  }
  .field-error{color:var(--danger);font-size:12px;margin-top:-8px;}
  .field-group{display:flex;flex-direction:column;gap:10px;padding-top:4px;border-top:1px solid var(--line);}
  .field-group-title{font-size:13px;font-weight:600;color:var(--ink);}
  .link-btn{background:none;border:none;color:var(--accent-hourly);font-size:13.5px;padding:4px 0;text-align:left;cursor:pointer;width:fit-content;}

  .payment-toggle{display:flex;gap:8px;}
  .toggle-option{
    flex:1;border:1px solid var(--line);border-radius:var(--radius);padding:10px;text-align:center;
    font-size:14px;cursor:pointer;position:relative;background:var(--paper-raised);
  }
  .toggle-option input{position:absolute;opacity:0;pointer-events:none;}
  .toggle-option.active{background:var(--ink);color:var(--paper-raised);border-color:var(--ink);}
  .rate-row{display:flex;gap:8px;align-items:flex-end;}

  .primary-btn{
    background:var(--ink);color:var(--paper-raised);border:none;padding:14px;
    border-radius:var(--radius);font-size:15.5px;font-weight:600;cursor:pointer;margin-top:6px;
  }
  .primary-btn:active{opacity:.85;}

  .detail-info{padding:14px 16px;display:flex;flex-direction:column;gap:6px;border-bottom:1px solid var(--line);}
  .detail-title-row{display:flex;align-items:center;gap:8px;flex-wrap:wrap;}
  .detail-title{font-size:19px;font-weight:700;line-height:1.3;}
  .detail-row{font-size:14px;color:var(--ink-soft);}
  .detail-row a{color:var(--ink-soft);}
  .detail-payment{font-family:'IBM Plex Mono',monospace;font-size:13.5px;color:var(--ink);margin-top:4px;}
  .detail-actions{display:flex;gap:16px;margin-top:8px;flex-wrap:wrap;align-items:center;}
  .edit-link{background:none;border:none;color:var(--accent-hourly);font-size:13.5px;padding:0;cursor:pointer;}
  .status-link{background:none;border:none;color:var(--accent-fixed);font-size:13.5px;padding:0;cursor:pointer;}
  .delete-link{background:none;border:none;color:var(--danger);font-size:13.5px;padding:0;cursor:pointer;}
  .confirm-yes{background:var(--danger);color:#fff;border:none;padding:6px 10px;border-radius:var(--radius);font-size:13px;cursor:pointer;}
  .confirm-no{background:none;border:1px solid var(--line);color:var(--ink);padding:6px 10px;border-radius:var(--radius);font-size:13px;cursor:pointer;}

  .ledger-header{display:flex;align-items:baseline;justify-content:space-between;padding:16px 16px 6px;}
  .ledger-title{font-size:15px;font-weight:600;}
  .ledger-summary{
    margin:0 16px 10px;padding:10px 12px;background:var(--paper-raised);border:1px solid var(--line);
    border-radius:var(--radius);font-family:'IBM Plex Mono',monospace;font-size:13px;color:var(--ink-soft);
    display:flex;justify-content:space-between;flex-wrap:wrap;gap:4px 10px;
  }
  .ledger-summary b{color:var(--ink);font-weight:600;}

  .day-row{padding:12px 16px;border-top:1px solid var(--line);}
  .day-row-top{display:flex;align-items:center;gap:8px;margin-bottom:8px;}
  .day-date-input{
    font-family:'IBM Plex Mono',monospace;font-size:14px;border:1px solid var(--line);
    border-radius:var(--radius);padding:7px 8px;background:var(--paper-raised);color:var(--ink);flex-shrink:0;
  }
  .day-hours{font-family:'IBM Plex Mono',monospace;font-size:13.5px;color:var(--accent-hourly);font-weight:600;flex:1;text-align:right;}
  .day-delete{background:none;border:none;color:var(--ink-soft);font-size:16px;padding:4px 6px;cursor:pointer;}
  .day-times-grid{display:grid;grid-template-columns:1fr 1fr;gap:8px;}
  .day-times-grid label{display:flex;flex-direction:column;gap:3px;}
  .day-times-grid .field-label{font-size:11.5px;}
  .day-times-grid input{font-family:'IBM Plex Mono',monospace;font-size:15px;padding:8px;border:1px solid var(--line);border-radius:var(--radius);background:var(--paper-raised);color:var(--ink);width:100%;}

  .day-photos-row{display:flex;flex-wrap:wrap;gap:8px;margin-top:10px;}
  .photo-tile{position:relative;width:60px;height:60px;flex-shrink:0;}
  .photo-tile img{width:100%;height:100%;object-fit:cover;border-radius:var(--radius);border:1px solid var(--line);display:block;}
  .photo-remove-x{position:absolute;top:-6px;right:-6px;width:20px;height:20px;border-radius:50%;background:var(--danger);color:#fff;border:none;font-size:12px;line-height:18px;text-align:center;cursor:pointer;padding:0;}
  .photo-add-tile{width:60px;height:60px;flex-shrink:0;border:1px dashed var(--accent-hourly);border-radius:var(--radius);display:flex;align-items:center;justify-content:center;color:var(--accent-hourly);font-size:24px;cursor:pointer;}

  .add-day-btn{
    display:block;width:calc(100% - 32px);margin:14px 16px 0;padding:12px;
    background:none;border:1px dashed var(--ink-soft);color:var(--ink);
    border-radius:var(--radius);font-size:14.5px;cursor:pointer;
  }
  .day-row-collapsed{padding-bottom:10px;}
  .day-open-btn{margin-left:auto;border:1px solid var(--line);background:var(--paper-raised);color:var(--ink);padding:6px 10px;border-radius:var(--radius);font-size:12px;cursor:pointer;}
  .day-save-btn{width:100%;margin-top:10px;border:1px solid var(--accent-hourly);background:var(--paper-raised);color:var(--accent-hourly);padding:10px 12px;border-radius:var(--radius);font-size:13px;font-weight:600;cursor:pointer;}
  .day-actions{display:flex;gap:8px;padding:14px 16px 0;}
  .quick-day-btn{flex:1;padding:12px;border:1px solid var(--ink);background:var(--ink);color:var(--paper-raised);border-radius:var(--radius);font-size:14.5px;font-weight:600;cursor:pointer;}
  .day-actions .add-day-btn{flex:1;width:auto;margin:0;}
  .day-quick-actions{display:flex;gap:7px;flex-wrap:wrap;margin-top:10px;}
  .day-quick-btn{border:1px solid var(--line);background:var(--paper-raised);color:var(--ink);padding:8px 10px;border-radius:var(--radius);font-size:12.5px;cursor:pointer;}
  .day-quick-btn.primary{border-color:var(--accent-hourly);color:var(--accent-hourly);}
  .day-quick-btn.break{border-color:var(--accent-fixed);color:var(--accent-fixed);}
  .break-list{display:flex;flex-direction:column;gap:6px;margin-top:10px;}
  .break-row{display:flex;align-items:center;gap:7px;font-family:'IBM Plex Mono',monospace;font-size:12.5px;color:var(--ink-soft);}
  .break-row .break-type{font-family:'Golos Text',sans-serif;min-width:62px;color:var(--ink);}
  .break-row input{font-family:'IBM Plex Mono',monospace;font-size:13px;padding:6px;border:1px solid var(--line);border-radius:var(--radius);background:var(--paper-raised);color:var(--ink);}
  .break-delete{border:none;background:none;color:var(--danger);font-size:15px;padding:4px;cursor:pointer;}


  .modal-overlay{position:fixed;inset:0;background:rgba(20,18,14,.55);display:flex;align-items:center;justify-content:center;z-index:30;padding:20px;}
  .modal-box{background:var(--paper-raised);border-radius:var(--radius);padding:16px;max-width:440px;width:100%;max-height:82vh;overflow-y:auto;display:flex;flex-direction:column;gap:10px;}
  .modal-title{font-size:15.5px;font-weight:700;}
  .modal-box textarea{width:100%;height:160px;font-family:'IBM Plex Mono',monospace;font-size:11px;padding:8px;border:1px solid var(--line);border-radius:var(--radius);background:var(--paper);color:var(--ink);}
  .modal-hint{font-size:12px;color:var(--ink-soft);line-height:1.5;}
  .modal-row{display:flex;gap:8px;}
</style>

<style id="worklog-pure-grayscale">
:root{
  --bg:#f5f5f5 !important;
  --paper:#ffffff !important;
  --paper-raised:#ffffff !important;
  --ink:#171717 !important;
  --muted:#737373 !important;
  --line:#e5e5e5 !important;
  --line-strong:#d4d4d4 !important;
  --accent-hourly:#171717 !important;
  --accent-fixed:#171717 !important;
}
html,body{background:#f5f5f5!important;color:#171717!important}
header,main{background:#f5f5f5!important}
.card,.job-card,.panel,.section,.summary-card,
.modal>*,.modal-card{background:#fff!important;border-color:#e5e5e5!important}
.day-row{background:#fff!important;border-color:#e5e5e5!important}
.day-row-collapsed,.break-row,.photo-add-tile{background:#fafafa!important}
input,select,textarea{background:#fff!important;color:#171717!important;border-color:#d4d4d4!important}
input:focus,select:focus,textarea:focus{
  border-color:#171717!important;
  box-shadow:0 0 0 2px rgba(23,23,23,.08)!important
}
.icon-btn,.day-open-btn,.day-quick-btn.break{
  background:#fff!important;color:#171717!important;border-color:#d4d4d4!important
}
.primary-btn,.add-btn,.day-quick-btn.primary,.day-save-btn{
  background:#171717!important;color:#fff!important;border-color:#171717!important
}
.field-label,.label,.muted,.hint,.meta{color:#737373!important}
.day-hours{color:#171717!important}
.day-delete,.break-delete{color:#737373!important}
.bottom-nav{background:rgba(255,255,255,.97)!important;border-color:#e5e5e5!important}
.bottom-nav button{color:#737373!important}
.bottom-nav button.active,.bottom-nav button[aria-current="page"]{color:#171717!important}
.bottom-nav .plus{background:#171717!important;color:#fff!important}
.photo-add-tile{color:#737373!important;border-color:#d4d4d4!important}
hr{border-color:#e5e5e5!important}
a{color:#171717!important}
.modal{background:rgba(0,0,0,.38)!important}

/* Statuses are the only intentional colors. */
.status-active,.badge-active,.status-badge.active{
  background:#dcfce7!important;color:#166534!important
}
.status-done,.badge-done,.status-badge.done{
  background:#dbeafe!important;color:#1d4ed8!important
}
.status-new,.badge-new,.status-badge.new{
  background:#fef3c7!important;color:#92400e!important
}
</style>


<style id="worklog-advance-ui">
.advance-box{margin-top:4px;padding:12px;background:#fafafa;border:1px solid #e5e5e5;border-radius:8px}
.check-row{display:flex;align-items:center;gap:8px;font-weight:600;color:#171717;cursor:pointer}
.check-row input{width:16px;height:16px;accent-color:#171717}
.advance-row{display:grid;grid-template-columns:1fr 1.2fr;gap:8px;margin-top:10px}
.advance-preview{margin-top:7px;font-size:12px;color:#737373;line-height:1.4}

.stats-panel{padding:0 16px 24px;}
.stats-section{margin:12px 0;padding:14px;background:#fff;border:1px solid var(--line);border-radius:8px;}
.stats-section-title{font-size:12px;text-transform:uppercase;letter-spacing:.08em;color:#737373;font-weight:600;margin-bottom:10px;}
.stats-month-nav{display:flex;align-items:center;justify-content:space-between;padding:14px 16px;border-bottom:1px solid var(--line);background:#fff;position:sticky;top:0;z-index:4;}
.stats-month-label{font-size:15px;font-weight:700;}
.stats-nav-btn{border:0;background:none;color:#171717;font-size:24px;line-height:1;padding:2px 10px;cursor:pointer;}
.stats-kpis{display:grid;grid-template-columns:1fr 1fr;gap:8px;}
.stats-kpi{padding:12px;border:1px solid var(--line);border-radius:6px;background:#fafafa;}
.stats-kpi span{display:block;color:#737373;font-size:11px;margin-bottom:5px;}
.stats-kpi b{font-size:17px;line-height:1.2;}
.stats-money-list{display:flex;flex-direction:column;gap:6px;}
.stats-money-row{display:flex;justify-content:space-between;gap:12px;font-family:'IBM Plex Mono',monospace;font-size:13px;padding:8px 0;border-bottom:1px solid #eee;}
.stats-money-row:last-child{border-bottom:0;}
.stats-chart{display:flex;flex-direction:column;gap:9px;}
.stats-chart-row{display:grid;grid-template-columns:58px 1fr 70px;gap:8px;align-items:center;font-size:11px;}
.stats-chart-label{color:#737373;}
.stats-bar-wrap{height:12px;background:#f0f0f0;border-radius:2px;overflow:hidden;}
.stats-bar{height:100%;background:#171717;min-width:2px;}
.stats-chart-value{text-align:right;font-family:'IBM Plex Mono',monospace;font-size:11px;}
.stats-currency-tabs{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:10px;}
.stats-currency-btn{border:1px solid var(--line);background:#fff;color:#737373;border-radius:4px;padding:6px 9px;font-size:11px;cursor:pointer;}
.stats-currency-btn.active{background:#171717;color:#fff;border-color:#171717;}
.stats-work-types{display:grid;grid-template-columns:1fr 1fr;gap:8px;}
.stats-work-type{padding:12px;border:1px solid var(--line);border-radius:6px;background:#fafafa;}
.stats-work-type span{display:block;color:#737373;font-size:11px;margin-bottom:4px;}
.stats-work-type b{font-size:18px;}
.stats-empty{color:#737373;font-size:12px;line-height:1.5;}
.stats-topbar{padding:14px 16px 4px;}
.stats-topbar-title{font-size:20px;font-weight:700;}
.stats-topbar-subtitle{font-size:12px;color:#737373;margin-top:3px;}
.bottom-nav{position:fixed;left:50%;bottom:0;transform:translateX(-50%);width:min(480px,100%);display:grid;grid-template-columns:1fr 1fr;gap:0;padding:7px 10px calc(7px + env(safe-area-inset-bottom));border-top:1px solid var(--line);background:rgba(255,255,255,.97);backdrop-filter:blur(10px);z-index:20;}
.bottom-nav button{border:0;background:none;color:#8a8a8a;padding:10px 4px;font-size:12px;font-weight:500;cursor:pointer;min-height:40px;}
.bottom-nav button.active{color:#171717;font-weight:700;}
#app{padding-bottom:86px;}

/* v0.16 UX polish */
.touch-action{min-width:44px;min-height:44px;display:inline-flex;align-items:center;justify-content:center;}
.day-delete,.break-delete,.photo-remove-x{min-width:44px;min-height:44px;padding:8px;}
.day-quick-btn,.quick-day-btn,.add-day-btn,.day-save-btn,.add-job-btn,.notice-btn,.primary-btn,.confirm-yes,.confirm-no{min-height:44px;}
.confirm-modal-overlay{position:fixed;inset:0;background:rgba(0,0,0,.28);display:flex;align-items:flex-end;justify-content:center;padding:16px;z-index:100;}
.confirm-modal{width:min(480px,100%);background:#fff;border:1px solid var(--line);border-radius:14px;padding:18px;box-shadow:0 12px 40px rgba(0,0,0,.16);}
.confirm-modal-title{font-size:17px;font-weight:700;color:var(--ink);}
.confirm-modal-text{margin-top:7px;color:var(--ink-soft);font-size:13px;line-height:1.5;}
.confirm-modal-actions{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:16px;}
.toast{position:fixed;left:50%;bottom:calc(78px + env(safe-area-inset-bottom));transform:translateX(-50%);background:#171717;color:#fff;border-radius:999px;padding:9px 14px;font-size:12px;font-weight:600;z-index:110;box-shadow:0 6px 22px rgba(0,0,0,.18);}
@media (min-width:600px){.confirm-modal-overlay{align-items:center;}.confirm-modal{border-radius:12px;}}
</style>
</head>
<body>
<div id="app"></div>

<script>
(function(){
  "use strict";

  var jobs = [];
  var view = 'list';        // 'list' | 'stats' | 'add' | 'detail'
  var currentJobId = null;
  var editingJob = false;
  var statusFilter = 'all'; // 'all' | 'active' | 'done'
  var confirmDeleteJobId = null;
  var exportModalText = null;
  var showImportPaste = false;
  var importError = null;
  var locationErrorText = null;
  var dayDeleteConfirm = null;
  var toastText = null;
  var toastTimer = null;

  var CURRENCIES = ['BYN','EUR','SEK','USD','PLN'];
  var MONTH_NAMES = ['January','February','March','April','May','June','July','August','September','October','November','December'];

  function pad2(n){ return (n<10?'0':'')+n; }
  function currentMonthKey(){
    var d = new Date();
    return d.getFullYear()+'-'+pad2(d.getMonth()+1);
  }
  var statsMonth = currentMonthKey();
  var statsCurrency = null;

  // ---------- utils ----------
  function esc(s){
    if(s===undefined||s===null) return '';
    return String(s).replace(/[&<>"']/g, function(c){
      return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c];
    });
  }
  function uid(prefix){ return prefix + Date.now().toString(36) + Math.random().toString(36).slice(2,7); }
  function pluralDays(n){
    var n10=n%10, n100=n%100;
    if(n10===1 && n100!==11) return 'day';
    if(n10>=2 && n10<=4 && !(n100>=12&&n100<=14)) return 'days';
    return 'days';
  }
  function toMin(t){ var p=t.split(':'); return (+p[0])*60+(+p[1]); }
  function computeDayMinutes(day){
    if(!day.start || !day.end) return 0;
    var total = toMin(day.end) - toMin(day.start);
    if(total<0) total += 24*60;

    // New model: any number of breaks can be deducted.
    if(Array.isArray(day.breaks)){
      day.breaks.forEach(function(br){
        if(br && br.start && br.end){
          var b = toMin(br.end) - toMin(br.start);
          if(b<0) b += 24*60;
          if(b>0) total -= b;
        }
      });
    } else if(day.breakStart && day.breakEnd){
      // Backward compatibility with older backups.
      var legacy = toMin(day.breakEnd) - toMin(day.breakStart);
      if(legacy<0) legacy += 24*60;
      if(legacy>0) total -= legacy;
    }
    return Math.max(0,total);
  }
  function formatMin(min){
    var h=Math.floor(min/60), m=min%60;
    if(h===0 && m===0) return '0 min';
    if(h===0) return m+' min';
    if(m===0) return h+' h';
    return h+' h '+m+' min';
  }
  function dayHoursLabel(day){
    if(!day.start || !day.end) return '—';
    return formatMin(computeDayMinutes(day));
  }
  function jobTotals(job){
  var totalMin=0;
  job.days.forEach(function(d){ totalMin += computeDayMinutes(d); });
  var hours = totalMin/60;

  var pay = job.paymentType==='hourly'
    ? hours*(job.rate||0)
    : (job.fixedAmount||0);

  var payable = pay;

  if(job.paymentType==='fixed' && job.advanceReceived===true){
    payable = remainingAmount(job);
  }

  return {
    totalMin: totalMin,
    pay: pay,
    payable: payable
  };
}
  function formatMoney(n, currency){
    var rounded = Math.round(n*100)/100;
    var opts = {minimumFractionDigits: (rounded%1===0)?0:2, maximumFractionDigits:2};
    return rounded.toLocaleString('ru-RU', opts) + ' ' + currency;
  }
  function advanceAmount(job){
    if(!job || job.paymentType!=='fixed') return 0;
    var total = Number(job.fixedAmount)||0;
    var value = Number(job.advanceValue)||0;
    if(job.advanceType==='percent') return Math.min(total, Math.max(0, total*value/100));
    return Math.min(total, Math.max(0, value));
  }
  function remainingAmount(job){
    return Math.max(0, (Number(job.fixedAmount)||0) - advanceAmount(job));
  }
  function paymentLine(job){
    if(job.paymentType==='hourly') return 'Hourly — ' + (job.rate||0) + ' ' + job.currency + '/h';
    var total = formatMoney(job.fixedAmount||0, job.currency);
    var adv = advanceAmount(job);
    if(adv>0) return 'Fixed — ' + total + ' · Advance ' + formatMoney(adv, job.currency) + (job.advanceReceived===true ? ' · Received' : ' · Not received') + ' · Remaining ' + formatMoney(remainingAmount(job), job.currency);
    return 'Fixed — ' + total;
  }
  function currencySelect(selected){
    return '<select name="currency">' + CURRENCIES.map(function(c){
      return '<option value="'+c+'" '+(c===selected?'selected':'')+'>'+c+'</option>';
    }).join('') + '</select>';
  }
  function monthAdd(mk, delta){
    var parts = mk.split('-'); var y=+parts[0], m=(+parts[1]-1)+delta;
    y += Math.floor(m/12);
    m = ((m%12)+12)%12;
    return y + '-' + pad2(m+1);
  }
  function monthLabel(mk){
    var p = mk.split('-');
    return MONTH_NAMES[(+p[1])-1] + ' ' + p[0];
  }
  function computeMonthlyTotals(){
    var map = {};
    jobs.forEach(function(job){
      if(job.paymentType==='hourly'){
        job.days.forEach(function(day){
          if(!day.date) return;
          var mins = computeDayMinutes(day);
          if(mins<=0) return;
          var mk = day.date.slice(0,7);
          if(!map[mk]) map[mk] = {hoursMin:0, pay:{}};
          map[mk].hoursMin += mins;
          var earn = (mins/60)*(job.rate||0);
          map[mk].pay[job.currency] = (map[mk].pay[job.currency]||0) + earn;
        });
      } else if(job.advanceReceived===true){
        // Fixed-price jobs contribute only money that was actually received.
        // The month is determined by the date when "Advance received" was checked.
        var receivedMonth = null;
        if(job.advanceReceivedAt){
          receivedMonth = new Date(job.advanceReceivedAt).getFullYear()+'-'+pad2(new Date(job.advanceReceivedAt).getMonth()+1);
        } else {
          var dated = job.days.filter(function(d){ return !!d.date; }).map(function(d){ return d.date; }).sort();
          if(dated.length) receivedMonth = dated[dated.length-1].slice(0,7);
        }
        if(!receivedMonth) return;
        if(!map[receivedMonth]) map[receivedMonth] = {hoursMin:0, pay:{}};
        var received = advanceAmount(job);
        if(received>0){
          map[receivedMonth].pay[job.currency] = (map[receivedMonth].pay[job.currency]||0) + received;
        }
      }
    });
    return map;
  }
  function payMapToString(payMap){
    var keys = Object.keys(payMap);
    if(keys.length===0) return '—';
    return keys.map(function(c){ return formatMoney(payMap[c], c); }).join(' · ');
  }
  function filteredJobs(){
    if(statusFilter==='all') return jobs;
    return jobs.filter(function(j){ return (j.status||'active')===statusFilter; });
  }

  // ---------- photo compression (local only, no network/storage) ----------
  function compressImage(file, maxDim, quality){
    return new Promise(function(resolve, reject){
      var reader = new FileReader();
      reader.onerror = function(){ reject(reader.error); };
      reader.onload = function(){
        var img = new Image();
        img.onerror = reject;
        img.onload = function(){
          var w=img.width, h=img.height;
          if(w>=h && w>maxDim){ h=Math.round(h*maxDim/w); w=maxDim; }
          else if(h>w && h>maxDim){ w=Math.round(w*maxDim/h); h=maxDim; }
          var canvas = document.createElement('canvas');
          canvas.width=w; canvas.height=h;
          var ctx = canvas.getContext('2d');
          ctx.drawImage(img,0,0,w,h);
          resolve(canvas.toDataURL('image/jpeg', quality));
        };
        img.src = reader.result;
      };
      reader.readAsDataURL(file);
    });
  }
  function handlePhotoChange(jobId, dayId, fileInput){
    var file = fileInput.files && fileInput.files[0];
    if(!file) return;
    compressImage(file, 1280, 0.72).then(function(dataUrl){
      var job = jobs.find(function(j){ return j.id===jobId; });
      var day = job.days.find(function(d){ return d.id===dayId; });
      if(!day.photos) day.photos = [];
      day.photos.push(dataUrl);
      showToast('Photo added');
      render();
    }).catch(function(e){
      console.error(e);
    });
  }
  function removePhoto(jobId, dayId, index){
    var job = jobs.find(function(j){ return j.id===jobId; });
    var day = job.days.find(function(d){ return d.id===dayId; });
    day.photos.splice(index,1);
    showToast('Photo removed');
    render();
  }

  // ---------- mutations ----------
  function localToday(){
    var d = new Date();
    return d.getFullYear()+'-'+pad2(d.getMonth()+1)+'-'+pad2(d.getDate());
  }

  function currentTime(){
    var d = new Date();
    return pad2(d.getHours())+':'+pad2(d.getMinutes());
  }

  function normalizeDay(day){
    if(!Array.isArray(day.breaks)){
      day.breaks = [];
      if(day.breakStart || day.breakEnd){
        day.breaks.push({id:uid('b'), type:'break', start:day.breakStart||'', end:day.breakEnd||''});
      }
    }
    if(typeof day.collapsed!=='boolean') day.collapsed=false;
    delete day.breakStart;
    delete day.breakEnd;
    return day;
  }

  function addDay(jobId){
    var job = jobs.find(function(j){ return j.id===jobId; });
    if(!job) return;
    job.days.forEach(function(d){ normalizeDay(d); d.collapsed=true; });
    var nextDate = localToday();
    var dated = job.days.map(function(d){ return d.date; }).filter(Boolean).sort();
    if(dated.length){
      var last = new Date(dated[dated.length-1]+'T12:00:00');
      last.setDate(last.getDate()+1);
      nextDate = last.getFullYear()+'-'+pad2(last.getMonth()+1)+'-'+pad2(last.getDate());
    }
    job.days.push({id:uid('d'),date:nextDate,start:'',end:'',breaks:[],photos:[],collapsed:false});
    render();
  }

  function saveDay(jobId, dayId){
    var job=jobs.find(function(j){return j.id===jobId;}); if(!job) return;
    var day=job.days.find(function(d){return d.id===dayId;}); if(!day) return;
    normalizeDay(day); day.collapsed=true; showToast('Work day saved'); render();
  }
  function openDay(jobId, dayId){
    var job=jobs.find(function(j){return j.id===jobId;}); if(!job) return;
    job.days.forEach(function(d){normalizeDay(d); d.collapsed=true;});
    var day=job.days.find(function(d){return d.id===dayId;}); if(!day) return;
    day.collapsed=false; render();
  }

  function addTodayQuick(jobId){
    var job = jobs.find(function(j){ return j.id===jobId; });
    job.days.forEach(normalizeDay);
    var today = localToday();
    var day = job.days.find(function(d){ return d.date===today; });
    if(!day){
      day = {id:uid('d'), date:today, start:currentTime(), end:'', breaks:[], photos:[]};
      job.days.push(day);
    } else if(!day.start){
      day.start=currentTime();
    }
    render();
  }

  function startDay(jobId, dayId){
    var job = jobs.find(function(j){ return j.id===jobId; });
    var day = job.days.find(function(d){ return d.id===dayId; });
    normalizeDay(day);
    if(!day.start) day.start=currentTime();
    render();
  }

  function endDay(jobId, dayId){
    var job = jobs.find(function(j){ return j.id===jobId; });
    var day = job.days.find(function(d){ return d.id===dayId; });
    normalizeDay(day);
    if(!day.end) day.end=currentTime();
    render();
  }

  function addBreak(jobId, dayId, type){
    var job = jobs.find(function(j){ return j.id===jobId; });
    var day = job.days.find(function(d){ return d.id===dayId; });
    normalizeDay(day);
    day.breaks.push({id:uid('b'), type:type||'break', start:currentTime(), end:''});
    render();
  }

  function finishBreak(jobId, dayId, breakId){
    var job = jobs.find(function(j){ return j.id===jobId; });
    var day = job.days.find(function(d){ return d.id===dayId; });
    normalizeDay(day);
    var br = day.breaks.find(function(b){ return b.id===breakId; });
    if(br && !br.end) br.end=currentTime();
    render();
  }

  function deleteBreak(jobId, dayId, breakId){
    var job = jobs.find(function(j){ return j.id===jobId; });
    var day = job.days.find(function(d){ return d.id===dayId; });
    normalizeDay(day);
    day.breaks = day.breaks.filter(function(b){ return b.id!==breakId; });
    render();
  }
  function updateDayField(jobId, dayId, field, value){
    var job = jobs.find(function(j){ return j.id===jobId; });
    var day = job.days.find(function(d){ return d.id===dayId; });
    day[field] = value;
    render();
  }
  function deleteDay(jobId, dayId){
    var job = jobs.find(function(j){ return j.id===jobId; });
    if(!job) return;
    job.days = job.days.filter(function(d){ return d.id!==dayId; });
    dayDeleteConfirm = null;
    showToast('Work day deleted');
    render();
  }
  function showToast(message){
    toastText = message;
    if(toastTimer) clearTimeout(toastTimer);
    toastTimer = setTimeout(function(){ toastText=null; render(); }, 1400);
  }
  function renderDayDeleteModal(){
    if(!dayDeleteConfirm) return '';
    return '<div class="confirm-modal-overlay" id="day-delete-modal" role="dialog" aria-modal="true" aria-labelledby="day-delete-title">'+
      '<div class="confirm-modal">'+
      '<div class="confirm-modal-title" id="day-delete-title">Delete this work day?</div>'+
      '<div class="confirm-modal-text">The recorded time, breaks and photos for this day will be deleted. This action cannot be undone.</div>'+
      '<div class="confirm-modal-actions">'+
      '<button class="confirm-no" id="day-delete-cancel">Cancel</button>'+
      '<button class="confirm-yes" id="day-delete-confirm">Delete day</button>'+

  function toggleJobStatus(jobId){
    var job = jobs.find(function(j){ return j.id===jobId; });
    job.status = (job.status==='done') ? 'active' : 'done';
    render();
  }
  function deleteJobById(jobId){
    jobs = jobs.filter(function(j){ return j.id!==jobId; });
    view='list'; currentJobId=null; confirmDeleteJobId=null;
    render();
  }
  function handleJobFormSubmit(e, existingId){
    e.preventDefault();
    var form = e.target;
    var fd = new FormData(form);
    var location = (fd.get('location')||'').trim();
    if(!location){
      var field = form.querySelector('input[name="location"]').closest('.field');
      var err = field.querySelector('.field-error');
      if(!err){
        err = document.createElement('div');
        err.className = 'field-error';
        field.appendChild(err);
      }
      err.textContent = 'Enter a location or work site.';
      return;
    }
    var customer1 = { name:(fd.get('cust1name')||'').trim(), phone:(fd.get('cust1phone')||'').trim() };
    var c2n = (fd.get('cust2name')||'').trim(), c2p = (fd.get('cust2phone')||'').trim();
    var customer2 = (c2n || c2p) ? {name:c2n, phone:c2p} : null;
    var paymentType = fd.get('paymentType') || 'hourly';
    var rate = parseFloat(fd.get('rate')) || 0;
    var fixedAmount = parseFloat(fd.get('fixedAmount')) || 0;
    var advanceType = fd.get('advanceType') || 'amount';
    var advanceEnabled = paymentType==='fixed' && document.getElementById('advance-enabled') && document.getElementById('advance-enabled').checked;
   var advanceValue = advanceEnabled ? (parseFloat(fd.get('advanceValue')) || 0) : 0;
var advanceReceived =
  advanceEnabled &&
  document.getElementById('advance-received') &&
  document.getElementById('advance-received').checked;
    
var currency = fd.get('currency') || 'BYN';
    if(paymentType!=='fixed'){ advanceType='amount'; advanceValue=0; }
    if(advanceType==='percent') advanceValue=Math.min(100, Math.max(0, advanceValue));
    else advanceValue=Math.min(Math.max(0, fixedAmount), Math.max(0, advanceValue));

    if(existingId){
      var job = jobs.find(function(j){ return j.id===existingId; });
      job.location=location; job.customer1=customer1; job.customer2=customer2;
      job.paymentType=paymentType; job.rate=rate; job.fixedAmount=fixedAmount; job.advanceEnabled=!!advanceEnabled; job.advanceType=advanceType; job.advanceValue=advanceValue; job.currency=currency;
      job.advanceReceived=!!advanceReceived;
      if(advanceReceived && !job.advanceReceivedAt) job.advanceReceivedAt=Date.now();
      if(!advanceReceived) job.advanceReceivedAt=null;
      editingJob=false; view='detail'; currentJobId=job.id;
    } else {
      var newJob = {id:uid('j'), createdAt:Date.now(), location:location, customer1:customer1, customer2:customer2,
        paymentType:paymentType, rate:rate, fixedAmount:fixedAmount, advanceEnabled:!!advanceEnabled, advanceType:advanceType, advanceValue:advanceValue, currency:currency, advanceReceived:!!advanceReceived, advanceReceivedAt:advanceReceived ? Date.now() : null, status:'active', days:[]};
      jobs.unshift(newJob);
      view='detail'; currentJobId=newJob.id;
    }
    render();
  }

  // ---------- export / import ----------
  function exportData(){
    var dataStr = JSON.stringify(jobs);
    try {
      var blob = new Blob([dataStr], {type:'application/json'});
      var url = URL.createObjectURL(blob);
      var a = document.createElement('a');
      a.href = url;
      var d = new Date();
      a.download = 'naryady-'+d.getFullYear()+pad2(d.getMonth()+1)+pad2(d.getDate())+'.json';
      document.body.appendChild(a);
      a.click();
      document.body.removeChild(a);
      setTimeout(function(){ URL.revokeObjectURL(url); }, 4000);
    } catch(e){ console.error(e); }
    exportModalText = dataStr;
    render();
  }
  function applyImportedJson(text){
    try {
      var imported = JSON.parse(text);
      if(!Array.isArray(imported)) throw new Error('bad format');
      imported.forEach(function(importedJob){
        if(!importedJob || !importedJob.id) return;
        var idx = jobs.findIndex(function(j){ return j.id===importedJob.id; });
        if(idx>=0) jobs[idx] = importedJob; else jobs.unshift(importedJob);
      });
      jobs.sort(function(a,b){ return (b.createdAt||0)-(a.createdAt||0); });
      importError = null;
      showImportPaste = false;
    } catch(e){
      importError = 'Could not read the file — make sure it is a backup created by this app.';
    }
    render();
  }
  function importFromFile(fileInput){
    var file = fileInput.files && fileInput.files[0];
    if(!file) return;
    var reader = new FileReader();
    reader.onload = function(){ applyImportedJson(String(reader.result)); };
    reader.onerror = function(){ importError = 'Could not read the file.'; render(); };
    reader.readAsText(file);
  }

  // ---------- render ----------
  function getMonthStats(monthKey){
    var totals = computeMonthlyTotals();
    var cur = totals[monthKey] || {hoursMin:0,pay:{}};
    var workDays = {};
    var hourlyJobs = {};
    var fixedJobs = {};
    jobs.forEach(function(job){
      if(job.paymentType==='hourly'){
        (job.days||[]).forEach(function(day){
          if(!day.date || day.date.slice(0,7)!==monthKey) return;
          var mins=computeDayMinutes(day);
          if(mins<=0) return;
          workDays[day.date]=true;
          hourlyJobs[job.id]=true;
        });
      } else {
        var receivedMonth=null;
        if(job.advanceReceived===true){
          if(job.advanceReceivedAt){
            var d=new Date(job.advanceReceivedAt);
            receivedMonth=d.getFullYear()+'-'+pad2(d.getMonth()+1);
          } else {
            var dated=(job.days||[]).filter(function(d){return !!d.date;}).map(function(d){return d.date;}).sort();
            if(dated.length) receivedMonth=dated[dated.length-1].slice(0,7);
          }
        }
        if(receivedMonth===monthKey) fixedJobs[job.id]=true;
        (job.days||[]).forEach(function(day){
          if(day.date && day.date.slice(0,7)===monthKey && computeDayMinutes(day)>0) workDays[day.date]=true;
        });
      }
    });
    var currencyKeys=Object.keys(cur.pay).sort();
    return {
      hoursMin:cur.hoursMin||0,
      workDays:Object.keys(workDays).length,
      pay:cur.pay||{},
      hourlyCount:Object.keys(hourlyJobs).length,
      fixedCount:Object.keys(fixedJobs).length,
      currencies:currencyKeys
    };
  }
  function getLastMonths(anchor,count){
    var arr=[];
    for(var i=count-1;i>=0;i--) arr.push(monthAdd(anchor,-i));
    return arr;
  }
  function formatHoursCompact(min){
    var h=Math.floor(min/60), m=min%60;
    if(m===0) return h+' h';
    return h+' h '+m+' min';
  }
  function statsCurrencies(months){
    var set={};
    var totals=computeMonthlyTotals();
    months.forEach(function(m){ Object.keys((totals[m]||{}).pay||{}).forEach(function(c){set[c]=true;}); });
    return Object.keys(set).sort();
  }
  function renderStatsView(){
    var s=getMonthStats(statsMonth);
    var months=getLastMonths(statsMonth,6);
    var totals=computeMonthlyTotals();
    var currencies=statsCurrencies(months);
    if(!statsCurrency || currencies.indexOf(statsCurrency)<0) statsCurrency=currencies[0]||null;
    var html='';
    html+='<div class="stats-topbar"><div class="stats-topbar-title">Statistics</div><div class="stats-topbar-subtitle">Income & Work Time</div></div>';

    html+='<div class="stats-panel">';
    html+='<div class="stats-section"><div class="stats-section-title">Time</div><div class="stats-kpis">';
    html+='<div class="stats-kpi"><span>Worked</span><b>'+formatMin(s.hoursMin)+'</b></div>';
    html+='<div class="stats-kpi"><span>Working days</span><b>'+s.workDays+'</b></div>';
    html+='</div>';
    var avg=s.workDays?Math.round(s.hoursMin/s.workDays):0;
    html+='<div style="margin-top:8px;color:#737373;font-size:12px;">Average per working day: <b style="color:#171717;">'+formatMin(avg)+'</b></div></div>';
    html+='<div class="stats-section"><div class="stats-section-title">Received</div>';
    if(Object.keys(s.pay).length){
      html+='<div class="stats-money-list">'+Object.keys(s.pay).sort().map(function(c){return '<div class="stats-money-row"><span>'+c+'</span><b>'+formatMoney(s.pay[c],c)+'</b></div>';}).join('')+'</div>';
    } else html+='<div class="stats-empty">No actual payments received this month yet.</div>';
    html+='</div>';
    html+='<div class="stats-section"><div class="stats-section-title">Received by month</div>';
    if(currencies.length){
      html+='<div class="stats-currency-tabs">'+currencies.map(function(c){return '<button class="stats-currency-btn '+(statsCurrency===c?'active':'')+'" data-currency="'+c+'">'+c+'</button>';}).join('')+'</div>';
      var vals=months.map(function(m){return Number(((totals[m]||{}).pay||{})[statsCurrency]||0);});
      var max=Math.max.apply(Math,vals.concat([0]));
      html+='<div class="stats-chart">'+months.map(function(m,i){var v=vals[i];var pct=max?Math.max(2,v/max*100):0;return '<div class="stats-chart-row"><span class="stats-chart-label">'+MONTH_NAMES[+m.slice(5)-1].slice(0,3)+'</span><div class="stats-bar-wrap"><div class="stats-bar" style="width:'+pct+'%"></div></div><span class="stats-chart-value">'+formatMoney(v,statsCurrency)+'</span></div>';}).join('')+'</div>';
    } else html+='<div class="stats-empty">Not enough data for the income chart.</div>';
    html+='</div>';
    html+='<div class="stats-section"><div class="stats-section-title">Worked by month</div>';
    var hourVals=months.map(function(m){return (totals[m]||{}).hoursMin||0;});

  var localStorageOk = false;
  function tryLoadFromLocalStorage(){
    try {
      var raw = window.localStorage.getItem('naryady-data');
      localStorageOk = true;
      if(raw){
        var parsed = JSON.parse(raw);
        if(Array.isArray(parsed)) {
          jobs = parsed;
          jobs.forEach(function(j){ (j.days||[]).forEach(normalizeDay); });
        }
      }
    } catch(e){ localStorageOk = false; }
  }
  function persistToLocalStorage(){
    if(!localStorageOk) return;
    try { window.localStorage.setItem('naryady-data', JSON.stringify(jobs)); }
    catch(e){ localStorageOk = false; }
  }

  function render(){
    persistToLocalStorage();
    var app = document.getElementById('app');
    var html;
    if(view==='stats'){ html = renderStatsView(); }
    else if(view==='add'){ html = renderFormView(null); }
    else if(view==='detail'){
      var job = jobs.find(function(j){ return j.id===currentJobId; });
      if(!job){ view='list'; html = renderListView(); }
      else if(editingJob){ html = renderFormView(job); }
      else { html = renderDetailView(job); }
    } else {
      html = renderListView();
    }
    html += renderExportModal();
    html += renderDayDeleteModal();
    if(toastText) html += '<div class="toast" role="status">✓ '+esc(toastText)+'</div>';
    app.innerHTML = html;
    attachListeners();
  }

  function attachListeners(){
    var addJobBtn = document.getElementById('add-job-btn');

    document.querySelectorAll('[data-nav]').forEach(function(btn){

        var target=btn.getAttribute('data-nav');
        if(target==='list'){ view='list'; currentJobId=null; editingJob=false; render(); }
        else if(target==='stats'){ view='stats'; currentJobId=null; editingJob=false; render(); }
      });
    });
    var statsPrev=document.getElementById('stats-prev');
    if(statsPrev) statsPrev.addEventListener('click', function(){ statsMonth=monthAdd(statsMonth,-1); render(); });
    var statsNext=document.getElementById('stats-next');
    if(statsNext) statsNext.addEventListener('click', function(){ statsMonth=monthAdd(statsMonth,1); render(); });
    document.querySelectorAll('[data-currency]').forEach(function(btn){
      btn.addEventListener('click', function(){ statsCurrency=btn.getAttribute('data-currency'); render(); });
    });

    var exportBtn = document.getElementById('export-btn');
    if(exportBtn) exportBtn.addEventListener('click', exportData);

    var importFileInput = document.getElementById('import-file-input');
    if(importFileInput) importFileInput.addEventListener('change', function(){ importFromFile(importFileInput); });

    var importPasteBtn = document.getElementById('import-paste-btn');
    if(importPasteBtn) importPasteBtn.addEventListener('click', function(){
      var ta = document.getElementById('import-paste-area');
      applyImportedJson(ta.value);
    });

    document.querySelectorAll('.tab-btn').forEach(function(btn){
      btn.addEventListener('click', function(){ statusFilter = btn.getAttribute('data-filter'); render(); });
    });

    document.querySelectorAll('.job-card').forEach(function(card){
      card.addEventListener('click', function(){
        currentJobId = card.getAttribute('data-id');
        view='detail'; editingJob=false; confirmDeleteJobId=null; render();
      });
    });

    var cancelFormBtn = document.getElementById('cancel-form-btn');
    if(cancelFormBtn) cancelFormBtn.addEventListener('click', function(){
      if(editingJob){ editingJob=false; view='detail'; } else { view='list'; currentJobId=null; }
      render();
    });

    var toggleCust2 = document.getElementById('toggle-cust2');
    if(toggleCust2) toggleCust2.addEventListener('click', function(){
      var div = document.getElementById('cust2-fields');
      var showing = div.style.display !== 'none';
      if(showing){
        div.style.display='none';
        toggleCust2.textContent='+ Add second customer';
        div.querySelectorAll('input').forEach(function(i){ i.value=''; });
      } else {
        div.style.display='flex';
        toggleCust2.textContent='✕ Remove second customer';
      }
    });

    document.querySelectorAll('input[name="paymentType"]').forEach(function(radio){
      radio.addEventListener('change', function(){
        document.querySelectorAll('.toggle-option').forEach(function(l){ l.classList.remove('active'); });
        radio.closest('.toggle-option').classList.add('active');
        var hourlyDiv = document.getElementById('hourly-fields');
        var fixedDiv = document.getElementById('fixed-fields');
        if(radio.value==='hourly'){ hourlyDiv.style.display='block'; fixedDiv.style.display='none'; }
        else { hourlyDiv.style.display='none'; fixedDiv.style.display='block'; }
      });
    });

    var advanceEnabled = document.getElementById('advance-enabled');
    var advanceFields = document.getElementById('advance-fields');
    var advanceType = document.getElementById('advance-type');
    var advanceValue = document.getElementById('advance-value');
    var fixedAmountInput = document.querySelector('input[name="fixedAmount"]');
    var advancePreview = document.getElementById('advance-preview');
    function updateAdvanceUI(){
      if(!advanceEnabled || !advanceFields) return;
      advanceFields.style.display = advanceEnabled.checked ? 'block' : 'none';
      if(!advanceEnabled.checked){ if(advanceValue) advanceValue.value=''; if(advancePreview) advancePreview.textContent=''; return; }
      var total = parseFloat(fixedAmountInput && fixedAmountInput.value) || 0;
      var val = parseFloat(advanceValue && advanceValue.value) || 0;
      if(advanceType && advanceType.value==='percent'){
        val=Math.min(100,Math.max(0,val));
        if(advancePreview) advancePreview.textContent='Advance: '+formatMoney(total*val/100, (document.querySelector('select[name="currency"]')||{}).value || 'BYN')+' · Remaining: '+formatMoney(Math.max(0,total-total*val/100), (document.querySelector('select[name="currency"]')||{}).value || 'BYN');
      } else {
        val=Math.min(Math.max(0,total),Math.max(0,val));
        if(advancePreview) advancePreview.textContent='Advance: '+formatMoney(val, (document.querySelector('select[name="currency"]')||{}).value || 'BYN')+' · Remaining: '+formatMoney(Math.max(0,total-val), (document.querySelector('select[name="currency"]')||{}).value || 'BYN');
      }
    }
    if(advanceEnabled) advanceEnabled.addEventListener('change', updateAdvanceUI);
    if(advanceType) advanceType.addEventListener('change', updateAdvanceUI);
    if(advanceValue) advanceValue.addEventListener('input', updateAdvanceUI);
    if(fixedAmountInput) fixedAmountInput.addEventListener('input', updateAdvanceUI);
    updateAdvanceUI();

    var jobForm = document.getElementById('job-form');
    if(jobForm) jobForm.addEventListener('submit', function(e){
      var existingId = (view==='detail' && editingJob) ? currentJobId : null;
      handleJobFormSubmit(e, existingId);
    });

    var backBtn = document.getElementById('back-btn');
    if(backBtn) backBtn.addEventListener('click', function(){ view='list'; currentJobId=null; render(); });

    var editJobBtn = document.getElementById('edit-job-btn');
    if(editJobBtn) editJobBtn.addEventListener('click', function(){ editingJob=true; render(); });

    var toggleStatusBtn = document.getElementById('toggle-status-btn');
    if(toggleStatusBtn) toggleStatusBtn.addEventListener('click', function(){ toggleJobStatus(currentJobId); });

    var deleteJobBtn = document.getElementById('delete-job-btn');
    if(deleteJobBtn) deleteJobBtn.addEventListener('click', function(){ confirmDeleteJobId = currentJobId; render(); });

    var confirmYes = document.getElementById('confirm-delete-yes');
    if(confirmYes) confirmYes.addEventListener('click', function(){ deleteJobById(currentJobId); });
    var confirmNo = document.getElementById('confirm-delete-no');
    if(confirmNo) confirmNo.addEventListener('click', function(){ confirmDeleteJobId=null; render(); });

    var addDayBtn = document.getElementById('add-day-btn');
    if(addDayBtn) addDayBtn.addEventListener('click', function(){ addDay(currentJobId); });

    var addTodayBtn = document.getElementById('add-today-btn');
    if(addTodayBtn) addTodayBtn.addEventListener('click', function(){ addTodayQuick(currentJobId); });

    document.querySelectorAll('.day-date-input, .day-times-grid input').forEach(function(inp){
      inp.addEventListener('change', function(){
        updateDayField(inp.getAttribute('data-job'), inp.getAttribute('data-day'), inp.getAttribute('data-field'), inp.value);
      });
    });

    document.querySelectorAll('[data-break-field]').forEach(function(inp){
      inp.addEventListener('change', function(){
        var job = jobs.find(function(j){ return j.id===inp.getAttribute('data-job'); });
        var day = job.days.find(function(d){ return d.id===inp.getAttribute('data-day'); });
        normalizeDay(day);
        var br = day.breaks.find(function(b){ return b.id===inp.getAttribute('data-break'); });
        if(br) br[inp.getAttribute('data-break-field')] = inp.value;
        render();
      });
    });

    document.querySelectorAll('.day-save-btn, .day-open-btn').forEach(function(btn){
      btn.addEventListener('click', function(){
        var jobId=btn.getAttribute('data-job'), dayId=btn.getAttribute('data-day');
        if(btn.getAttribute('data-action')==='save-day') saveDay(jobId,dayId); else openDay(jobId,dayId);
      });
    });

    document.querySelectorAll('.day-quick-btn').forEach(function(btn){
      btn.addEventListener('click', function(){
        var action=btn.getAttribute('data-action'), jobId=btn.getAttribute('data-job'), dayId=btn.getAttribute('data-day'), breakId=btn.getAttribute('data-break');
        if(action==='start') startDay(jobId,dayId);
        else if(action==='end') endDay(jobId,dayId);
        else if(action==='add-break') addBreak(jobId,dayId,'break');
        else if(action==='add-lunch') addBreak(jobId,dayId,'lunch');
        else if(action==='finish-break') finishBreak(jobId,dayId,breakId);
      });
    });

    document.querySelectorAll('.break-delete').forEach(function(btn){
      btn.addEventListener('click', function(){
        deleteBreak(btn.getAttribute('data-job'), btn.getAttribute('data-day'), btn.getAttribute('data-break'));
      });
    });

    document.querySelectorAll('.day-delete').forEach(function(btn){
      btn.addEventListener('click', function(){
        dayDeleteConfirm={jobId:btn.getAttribute('data-job'),dayId:btn.getAttribute('data-day')};
        render();
      });
    });
    var dayDeleteCancel=document.getElementById('day-delete-cancel');
    if(dayDeleteCancel) dayDeleteCancel.addEventListener('click', function(){ dayDeleteConfirm=null; render(); });
    var dayDeleteConfirmBtn=document.getElementById('day-delete-confirm');
    if(dayDeleteConfirmBtn) dayDeleteConfirmBtn.addEventListener('click', function(){
      if(dayDeleteConfirm) deleteDay(dayDeleteConfirm.jobId,dayDeleteConfirm.dayId);
    });
    var dayDeleteModal=document.getElementById('day-delete-modal');
    if(dayDeleteModal) dayDeleteModal.addEventListener('click', function(e){ if(e.target===dayDeleteModal){ dayDeleteConfirm=null; render(); } });

    document.querySelectorAll('.photo-input').forEach(function(inp){
      inp.addEventListener('change', function(){
        handlePhotoChange(inp.getAttribute('data-job'), inp.getAttribute('data-day'), inp);
      });
    });

    document.querySelectorAll('.photo-remove-x').forEach(function(btn){
      btn.addEventListener('click', function(){
        removePhoto(btn.getAttribute('data-job'), btn.getAttribute('data-day'), parseInt(btn.getAttribute('data-index'),10));
      });
    });

    var closeExportModal = document.getElementById('close-export-modal');
    if(closeExportModal) closeExportModal.addEventListener('click', function(){ exportModalText=null; render(); });
    var selectExportText = document.getElementById('select-export-text');
    if(selectExportText) selectExportText.addEventListener('click', function(){
      var ta = document.getElementById('export-textarea');
      ta.focus(); ta.select();
    });
  }

  tryLoadFromLocalStorage();
  render();
})();
</script>
</body>
</html>
